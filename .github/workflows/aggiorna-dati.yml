name: Aggiorna Dati da API

on:
  schedule:
    - cron: '0 */12 * * *' # Gira allo scoccare di ogni 12 ore 
  workflow_dispatch: # Questo ti fa apparire un bottone per avviarlo manualmente quando vuoi!

jobs:
  scarica-e-salva:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Questa riga è FONDAMENTALE per permettere al bot di modificare i file

    steps:
      - name: Scarica i file del tuo sito
        uses: actions/checkout@v4

      - name: Scarica i dati dall'API
        env:
          API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: |
          echo "Creando la cartella data/news..."
          mkdir -p data/news
          echo "Scaricando le notizie..."
          curl -s "https://newsapi.org/v2/everything?q=F1&domains=motorsport.com,autosport.com,racefans.net,the-race.com&language=en&sortBy=publishedAt&pageSize=20&apiKey=$API_KEY" > f1.json
          curl -s "https://newsapi.org/v2/everything?q=WEC+OR+%22Le+Mans%22+OR+%22GTWC%22+OR+%22GT+World+Challenge%22+OR+%22IGTC%22+OR+%22NLS%22&domains=sportscar365.com,dailysportscar.com,motorsport.com,fiawec.com,gt-world-challenge.com&language=en&sortBy=publishedAt&pageSize=20&apiKey=$API_KEY" > wec.json
          curl -s "https://newsapi.org/v2/everything?q=NASCAR+OR+IndyCar+OR+%22Indianapolis+500%22&domains=racer.com,motorsport.com,nascar.com,indycar.com,autosport.com&language=en&sortBy=publishedAt&pageSize=20&apiKey=$API_KEY" > us.json
          curl -s "https://newsapi.org/v2/everything?q=WRC&domains=motorsport.com,autosport.com,wrc.com&language=en&sortBy=publishedAt&pageSize=20&apiKey=$API_KEY" > wrc.json
          curl -s "https://newsapi.org/v2/everything?q=MOTOGP&domains=motorsport.com,autosport.com,motogp.com&language=en&sortBy=publishedAt&pageSize=20&apiKey=$API_KEY" > motogp.json
          
          echo "Unendo i file in data/news/data.json..."
          jq -n \
            --slurpfile f1 f1.json \
            --slurpfile wec wec.json \
            --slurpfile us us.json \
            --slurpfile wrc wrc.json \
            --slurpfile motogp motogp.json \
            '{
               status: "ok",
               f1_news: ($f1[0].articles // []),
               wec_news: ($wec[0].articles // []),
               us_news: ($us[0].articles // []),
               wrc_news: ($wrc[0].articles // []),
               motogp_news: ($motogp[0].articles // [])
            }' > data/news/data.json

      - name: Salva il nuovo data.json nel sito (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/news/data.json
          # Usiamo || true così se i dati non sono cambiati rispetto all'ora precedente, la action non va in errore
          git commit -m "🤖 Auto-update news data" || true
          git push