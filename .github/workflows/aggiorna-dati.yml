name: Aggiorna Dati da API

on:
  schedule:
    - cron: '0 */12 * * *' # Gira allo scoccare di ogni 12 ore 
  workflow_dispatch: # Questo ti fa apparire un bottone per avviarlo manualmente quando vuoi!

jobs:
  scarica-e-salva:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Questa riga è FONDAMENTALE per permettere al bot di modificare i file

    steps:
      - name: Scarica i file del tuo sito
        uses: actions/checkout@v4

      - name: Scarica i dati dall'API
        env:
          API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: |
          echo "Scaricando notizie F1..."
          curl -s "https://newsapi.org/v2/everything?q=formula1&language=en&sortBy=publishedAt&pageSize=5&apiKey=$API_KEY" > f1.json
          
          echo "Scaricando notizie MotoGP..."
          curl -s "https://newsapi.org/v2/everything?q=motogp&language=en&sortBy=publishedAt&pageSize=5&apiKey=$API_KEY" > motogp.json
          
          echo "Unendo i file in data.json..."
          jq -n --slurpfile f1 f1.json --slurpfile mgp motogp.json '{status: "ok", f1_news: $f1[0].articles, motogp_news: $mgp[0].articles}' > data/news/data.json

      - name: Salva il nuovo data.json nel sito (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/news/data.json
          # Usiamo || true così se i dati non sono cambiati rispetto all'ora precedente, la action non va in errore
          git commit -m "🤖 Auto-update news data" || true
          git push